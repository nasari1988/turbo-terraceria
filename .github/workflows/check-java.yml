name: Check Java (rápido)

on:
  push:
    branches: [ "nekogram-dev" ]
  workflow_dispatch:

concurrency:
  group: check-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Submódulos necesarios para compilar Java
        run: git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 platforms;android-37.0 ndk;27.3.13750724"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          printf 'apiId=1\napiHash=x\nhelperBotId=0\nhelperBotUsername=\nsentryDsn=\nmapsApiKey=\n' > local.properties

      - name: Compilar Java
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj:compileReleaseJavaWithJavac --continue 2>&1 | tee build.log

      - name: Publicar errores como anotaciones
        if: failure()
        run: |
          {
            grep -E -A6 "error:|What went wrong|Caused by|Could not" build.log | grep -v "^> Task" | head -120
          } > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 15 errors.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Compilación ($f)::$msg"
          done
