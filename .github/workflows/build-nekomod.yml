name: Build Neko Mod

on:
  push:
    branches: [ "nekogram" ]
  workflow_dispatch:

concurrency:
  group: build-nekomod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "4G"
    steps:
      - name: Check secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Faltan los secrets API_ID y/o API_HASH (Settings > Secrets and variables > Actions). Sácalos de https://my.telegram.org"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Configure signing and secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo "storeFile=${{ github.workspace }}/keystore.p12"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=nekomod"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } >> local.properties
          else
            echo "::warning::Sin KEYSTORE_PASSWORD: se firma con una llave temporal y no podrás actualizar encima de la versión anterior."
          fi

          {
            echo "apiId=$API_ID"
            echo "apiHash=$API_HASH"
            echo "helperBotId=0"
            echo "helperBotUsername="
            echo "sentryDsn="
            echo "mapsApiKey="
          } >> local.properties

          PKG=$(grep '^APP_PACKAGE=' gradle.properties | cut -d= -f2)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          else
            echo "::notice::Sin GOOGLE_SERVICES_JSON: se usa un Firebase de relleno (sin notificaciones push de Google)."
            cat > TMessagesProj_App/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "nekomod-dummy",
              "storage_bucket": "nekomod-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "$PKG" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleRelease 2>&1 | tee build.log

      - name: Publicar errores como anotaciones
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          { grep -E "error:|error |FAILED|What went wrong|^> |e: " build.log | grep -v "^> Task" | head -80; } > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 15 errors.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Compilación ($f)::$msg"
          done

      - name: Upload APK (sin zip)
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          archive: false
          retention-days: 30
